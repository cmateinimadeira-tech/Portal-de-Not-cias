name: Atualizar notícias
on:
  schedule:
    - cron: "0 */2 * * *"   # a cada 2h (UTC)
  workflow_dispatch:
concurrency:
  group: portal-publicacao
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.coletar_noticias
      - run: python -m src.ia.agrupar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -m src.build
      - name: Commit
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "chore: atualiza notícias" && git pull --rebase -X theirs && git push)

